<style>
#sfp-contract-review { --sfp-bg:light-dark(#f2f5f9,#071724);--sfp-panel:light-dark(#ffffff,#10283b);--sfp-text:light-dark(#142a3e,#e7f1fa);--sfp-muted:light-dark(#50677b,#a9bfd0);--sfp-line:light-dark(#d3dfe8,#2b465c);--sfp-accent:light-dark(#096b94,#50d5ef);--sfp-soft:light-dark(#e4f2fa,#153d56);--sfp-warn:light-dark(#854700,#ffc36b);color:var(--sfp-text);background:var(--sfp-bg);font:15px/1.8 Tahoma,Arial,sans-serif;direction:rtl;border-radius:14px;overflow:clip;color-scheme:light dark; }
#sfp-contract-review * {box-sizing:border-box}

#sfp-contract-review button,#sfp-contract-review select{font:inherit;min-height:42px;border:1px solid var(--sfp-line);border-radius:7px;padding:8px 12px;color:var(--sfp-text);background:var(--sfp-panel)}

#sfp-contract-review button:focus-visible,#sfp-contract-review select:focus-visible{outline:2px solid var(--sfp-accent);outline-offset:3px}
#sfp-contract-review main{min-width:0;padding:20px;display:grid;align-content:start;gap:16px}
#sfp-contract-review h2{font-size:21px;margin:0} #sfp-contract-review h3{font-size:16px;margin:0 0 9px}
#sfp-contract-review p{margin:0} #sfp-contract-review .muted{color:var(--sfp-muted)}
#sfp-contract-review .tag{display:inline-block;padding:2px 9px;border-radius:5px;background:var(--sfp-soft);color:var(--sfp-accent);font-size:12px}
#sfp-contract-review .warn{color:var(--sfp-warn)}
#sfp-contract-review .panel{background:var(--sfp-panel);border:1px solid var(--sfp-line);border-radius:10px;padding:16px;min-width:0}
#sfp-contract-review .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

#sfp-contract-review .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
#sfp-contract-review .listrow{padding:12px 0;border-bottom:1px solid var(--sfp-line)}
#sfp-contract-review .listrow:last-child{border-bottom:0}
#sfp-contract-review .primary{background:var(--sfp-accent);color:var(--sfp-bg);border-color:var(--sfp-accent)}
#sfp-contract-review .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#sfp-contract-review code{direction:ltr;unicode-bidi:isolate;display:inline-block;overflow-wrap:anywhere;font-size:12px;color:var(--sfp-accent)}
#sfp-contract-review .flow{display:grid;gap:10px;align-content:start}
#sfp-contract-review .node{border:1px solid var(--sfp-line);padding:12px;border-radius:8px;background:var(--sfp-panel)}
#sfp-contract-review .arrow{text-align:center;color:var(--sfp-accent)}
#sfp-contract-review .node.main{border-color:var(--sfp-accent);background:var(--sfp-soft)}
#sfp-contract-review dl{margin:0;display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,2fr);gap:9px 16px} #sfp-contract-review dt{color:var(--sfp-muted)}#sfp-contract-review dd{margin:0;overflow-wrap:anywhere}
#sfp-contract-review .table{width:100%;border-collapse:collapse;font-size:13px}#sfp-contract-review .table th,#sfp-contract-review .table td{text-align:right;padding:10px 6px;border-bottom:1px solid var(--sfp-line);vertical-align:top;overflow-wrap:anywhere}#sfp-contract-review .table th{color:var(--sfp-muted);font-weight:400}
#sfp-contract-review .notice{border-right:3px solid var(--sfp-warn);padding:8px 13px;background:var(--sfp-panel)}
#sfp-contract-review label{display:grid;gap:7px}
#sfp-contract-review footer{padding:10px 22px;border-top:1px solid var(--sfp-line);color:var(--sfp-muted);background:var(--sfp-panel);font-size:12px}
@media(max-width:700px){#sfp-contract-review .shell{grid-template-columns:1fr}#sfp-contract-review nav{border-left:0;border-bottom:1px solid var(--sfp-line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}#sfp-contract-review nav button{font-size:13px}#sfp-contract-review main{padding:13px}#sfp-contract-review .grid{grid-template-columns:1fr}#sfp-contract-review header{padding:12px}#sfp-contract-review dl{grid-template-columns:1fr}#sfp-contract-review dd{margin-bottom:6px}}

<div id="sfp-contract-review" lang="fa" dir="rtl">
 <header><div><span class="brand">SFP24</span> <span>مدیریت ماژول‌ها و اتصال‌ها</span></div><span class="tag">طرح پیشنهادی · Proposed — متصل به نرم‌افزار نیست</span></header>

 <footer>کد بررسی‌شده: <bdi>627feed / 55ad14d</bdi> · داده و وضعیت شرکت‌ها در این طرح استعلام نمی‌شود · هیچ عملیات نصب، ذخیره یا توقف اجرا نمی‌شود.</footer>

const screens={

<div class="listrow row"><div><strong>نگهداری و تعمیرات</strong><p class="muted">Maintenance · ماژول موجود پایلوت</p></div><span class="tag">ثبت کد‌محور · pilot_only</span>${go('detail','دیدن شناسنامه و قراردادها')}</div>
<div class="listrow row"><div><strong>ثبت و گزارش تولید</strong><p class="muted">Production · جریان موجود</p></div><span class="tag">ثبت کد‌محور</span>${go('contracts','دیدن مدل ورودی و خروجی')}</div>
`)+panel('طرح‌های آینده؛ قابل واگذاری به شرکت نیستند',`<div class="row"><div><strong>مدیریت انرژی</strong><p class="muted">Energy · مثال این بازبینی؛ پیاده‌سازی و Release ندارد</p></div><span class="tag">Proposed</span>${go('mapping','دیدن طرح اتصال انرژی')}</div>`),
detail:()=>panel('نگهداری و تعمیرات | Maintenance',`<div class="row"><span class="tag">Observed: Descriptor موجود</span><span class="tag">Product readiness: pilot_only</span></div><br><dl><dt>کلید</dt><dd>${code('maintenance')}</dd><dt>Release اعلام‌شده</dt><dd>${code('0.1.0-pilot')}</dd><dt>قرارداد Host</dt><dd>${code('host.module.v1')}</dd><dt>وابستگی اجباری اعلام‌شده</dt><dd>هیچ ماژول کسب‌وکاری</dd><dt>ارتباط اختیاری اعلام‌شده</dt><dd>Production؛ وجود قرارداد عمومیِ اتصال از این عبارت اثبات نمی‌شود.</dd><dt>منبع</dt><dd>${code('server/operations/module-capabilities.ts')}<br>فایل محلی جدیدِ ثبت‌نشده: ${code('maintenance/module.ts')}</dd></dl>`)+`<div class="grid">${panel('کاری که اکنون دیده می‌شود','درخواست خرابی، دستورکار، سابقهٔ تجهیز و اتصال‌های پایلوتِ کارتابل و اعلان. وجود کد با موفقیت آزمون تازه یکی نیست.')}${panel('چیزی که این صفحه اثبات نمی‌کند','نصب Package مستقل، امنیت کد ناشناس، اتصال عمومی به OEE یا انبار و آماده‌بودن همهٔ شرکت‌ها.')}</div><div class="actions">${go('contracts','ورودی‌ها و خروجی‌ها')}${go('ui','مشارکت‌های رابط')}${go('lifecycle','اثر توقف')}</div>`,
contracts:()=>note('جدول زیر مدل پیشنهادی قراردادهاست؛ Portهای موجود هنوز Schema معنایی عمومی ندارند.')+panel('مصرف‌کننده چه می‌خواهد؟',rows(['مصرف‌کننده','نیاز','نوع / الزام'],[['Maintenance','هویت تجهیز و محدودهٔ مجاز','Core Query · اجباری'],['Maintenance','مرجع گزارش تولید','DomainRef · اختیاری'],['Energy — Proposed','اندازه‌گیری معتبر انرژی','Parameter Binding · لازم برای مصرف انرژی'],['Energy — Proposed','تعداد سالم در همان بازه','Query · لازم فقط برای انرژی به‌ازای محصول']]))+panel('ارائه‌دهنده چه می‌دهد؟',rows(['ارائه‌دهنده','خروجی','وضعیت شاهد'],[['Maintenance','درخواست / سابقه / خلاصه','Port در کد موجود؛ قرارداد عمومی تکمیل نیست'],['Production','گزارش و تعداد تولید','سرویس موجود؛ مدل قرارداد پیشنهادی'],['Energy','مصرف بازه و شدت مصرف','فقط طراحی پیشنهادی']]))+`<div class="actions">${go('directory','معنای قراردادها')}${go('mapping','انتخاب تأمین‌کننده')}</div>`,
dependencies:()=>note('این نقشه وابستگی پیشنهادی قابلیت‌های انرژی است؛ نصب ماژول Production شرط کل ماژول انرژی نیست.')+`<div class="grid">${panel('مصرف انرژی مستقل',`<div class="flow"><div class="node">Core: تجهیز، Tenant، Scope و مجوز</div><div class="arrow">↓ پیش‌نیاز اجباری</div><div class="node main">Energy: مصرف در بازه</div><div class="arrow">↑ قرارداد اندازه‌گیری معتبر</div><div class="node">Provider اندازه‌گیری: Data Hub یا ورودی معتبر دیگر</div></div>`)}${panel('انرژی به‌ازای محصول',`<div class="flow"><div class="node">قابلیت مصرف انرژی</div><div class="arrow">↓ به‌علاوهٔ</div><div class="node">قرارداد تعداد سالم و بازهٔ اجرای تجهیز</div><div class="arrow">↓</div><div class="node main">قابلیت انرژی به‌ازای محصول</div><div class="node">Provider می‌تواند Production یا Connector معتبر باشد.</div></div>`)}</div>`,
integrations:()=>panel('اتصال پیشنهادی؛ هنوز برای هیچ شرکت ذخیره نشده',`<div class="flow"><div class="node">Parameter شرکت: اندازه‌گیری انرژی تجهیز</div><div class="arrow">↓ Binding با Scope تجهیز و بازه</div><div class="node">Adapter معتبر: تبدیل واحد در صورت نیاز</div><div class="arrow">↓</div><div class="node main">Energy · مصرف بازه</div><div class="arrow">↓ خروجی نسخه‌دار و دارای منشأ</div><div class="node">Widget مجاز، گزارش یا مصرف‌کنندهٔ BI</div></div>`)+note('بدون Binding تأییدشده، خط پیشنهادی به معنی اتصال فعال نیست. تغییر شرکت، انتخاب‌های شرکت دیگر را منتقل نمی‌کند.')+`<div class="actions">${go('mapping','بررسی ورودی و انتخاب منبع')}</div>`,
directory:()=>panel('فرهنگ قراردادهای پیشنهادی',rows(['قرارداد','معنا / مالک','آمادگی'],[[code('core.resource.reference'),'ارجاع به تجهیز مشترک؛ Core','مدل موجود؛ API عمومی این قرارداد پیشنهاد است'],[code('measurement.energy.interval'),'انرژی در بازه، واحد، زمان، کیفیت و منشأ؛ مالک معنایی اندازه‌گیری','Proposed'],[code('production.good-count.interval'),'تعداد سالم برای تجهیز و بازهٔ مشخص؛ Production','Proposed؛ برابر نام تابع فعلی نیست'],[code('maintenance.work.completed'),'تکمیل فنی کار؛ به معنی مجوز ایمن راه‌اندازی نیست','رخداد پایلوت موجود؛ قرارداد عمومی پیشنهاد است'],[code('qualification.validity'),'اعتبار صلاحیت برای فرد، فعالیت و زمان','Proposed؛ Provider اجرایی تأیید نشده']]))+note('وجود یک تعریف در این فهرست، وجود Provider، Permission یا اجرای موفق را اثبات نمی‌کند.'),
mapping:()=>note('تنظیم اتصال متعلق به شرکت است. این صفحه فقط شبیه‌سازی طراحی را نشان می‌دهد و ذخیره نمی‌کند.')+panel('Energy · ورودی انرژی بازه',`<div class="grid"><label>زمینهٔ تنظیم<select id="sfp-tenant"><option value="none">شرکت انتخاب نشده</option><option value="mihan">Mihan — مثال انتخاب، بدون استعلام</option><option value="demo-factory">Demo Factory — مثال انتخاب، بدون استعلام</option></select></label><label>نوع منبع پیشنهادی<select id="sfp-source"><option value="missing">منبع انتخاب نشده</option><option value="interval">انرژی بازه با واحد kWh</option><option value="convert">انرژی بازه با واحد Wh</option><option value="cumulative">شمارندهٔ تجمعی انرژی</option><option value="invalid">توان لحظه‌ای با واحد kW</option></select></label></div><div class="actions"><button id="sfp-check" type="button" class="primary cursor-interaction">بررسی مفهومی اتصال</button></div><p id="sfp-mapping-result" aria-live="polite" style="margin-top:12px">ابتدا زمینه و منبع را انتخاب کنید.</p>`)+panel('جزئیات لازم برای Binding واقعی','شناسه و Revision منبع، Scope تجهیز، بازهٔ اثر، کیفیت و تازگی، نسخهٔ قرارداد، Adapter، سیاست نبود داده و نتیجهٔ آزمون باید ثبت شوند. نمونه‌های بالا Parameter واقعیِ شرکت نیستند.'),
permissions:()=>panel('چه کسی چه اختیاری دارد؟',rows(['نقش','اختیار','محدودیت'],[['Developer / Publisher','اعلام Permission و Port در Descriptor','اعلام، معادل اعطای دسترسی نیست'],['Provider Admin','پذیرش ماژول مورد اعتماد و سیاست عرضه','حق خودکار خواندن اطلاعات خصوصی شرکت ندارد'],['Company Admin','تنظیم Binding و Scope مجاز','نمی‌تواند کد ناشناس یا Permission خارج از سیاست ایجاد کند'],['Access Admin','واگذاری Permission مصوب به نقش / فرد','مقید به Tenant، Person و Scope'],['کاربر / سرویس','اجرای Port با اختیار معتبر','کنترل دوباره در Backend']]))+panel('نمونهٔ موجود در کد',`${code('maintenance.request.create')}<br>${code('maintenance.perform')}<br>${code('maintenance.request.view_scope')}<p class="muted">Permissionهای انرژی در این بازبینی فقط پیشنهاد هستند.</p>`),
ui:()=>panel('Contributionهای Maintenance در پایلوت',rows(['بخش','Context','مرز واقعی'],[['اعلام خرابی','Desk / Resource','Component مورد اعتماد و ثبت‌شده در Host'],['سابقهٔ تعمیر','Resource','ارجاع تجهیز و Permission لازم'],['کارتابل و اعلان','Desk / Account','به سرویس‌های پایلوت متصل؛ SDK عمومی نیست'],['خلاصهٔ تعمیرات','Dashboard / Desk','نمای مشترکِ شناخته‌شده در Host']]))+panel('افزودن Contribution جدید — Proposed',`<div class="flow"><div class="node">تعریف نیاز: فرم، صفحه، Widget یا Profile Section</div><div class="arrow">↓</div><div class="node">Context و Port و Permission اعلام‌شده</div><div class="arrow">↓</div><div class="node main">Renderer مورد اعتماد + تأیید سازگاری</div><div class="arrow">↓</div><div class="node">چیدمان مجاز شرکت و نمایش برای کاربر واجد دسترسی</div></div>`),
compatibility:()=>note('در کد بررسی‌شده compatible ثابت true است؛ این مقدار شاهد آزمون سازگاری نیست.')+panel('ماتریس لازم پیش از اعلام سازگاری',rows(['لایه','شاهد موردنیاز','وضعیت این طرح'],[['Host / Module','بازهٔ نسخه و APIهای موردنیاز','Proposed'],['Provider / Consumer','Schema + معنا + زمان + واحد','Proposed'],['Adapter','تبدیل معتبر و آزمون مرزی','Proposed'],['Tenant Preparation','Schema، دادهٔ پایه و Binding معتبر','استعلام نشده'],['UI Context','Renderer، Context و Permission معتبر','الگوی پایلوت وجود دارد؛ تعمیم اثبات نشده'],['Upgrade / Rollback','اثر بر Binding، Receipt و تاریخچه','Proposed']]))+panel('نتیجهٔ قابل نمایش','اعلام‌شده، بررسی‌شده، آزموده‌شده یا نامعلوم؛ هرکدام با نسخه و شاهد خودش. «نامعلوم» نباید با «سازگار» جایگزین شود.'),
lifecycle:()=>panel('دو سطح جدا',rows(['سطح پلتفرم','سطح شرکت'],[['Build و Deploy','Entitlement'],['Register و Publication','Preparation و Binding'],['Retire / Unregister','Enable / Disable'],['حذف کد در انتشار کنترل‌شده','حفظ سوابق و دسترسی طبق سیاست']]))+panel('پیش از توقف یا خارج‌کردن Provider',`<div class="stack"><div class="node">کدام قابلیت‌ها و Bindingها به آن وابسته‌اند؟</div><div class="node">چه کار باز، Event معوق یا نتیجهٔ تحویل نامعلوم وجود دارد؟</div><div class="node">خواندن سابقه، Export و تکمیل کار قبلی چه سیاستی دارند؟</div><div class="node">آیا تمام APIها، Workerها و مسیرهای قدیمی Gate را رعایت می‌کنند؟</div></div>`)+note('توقف و Unregister اجرایی در این طرح ارائه نشده‌اند. حفظ داده الزام است؛ سیاست Drain، Emergency Stop و Recovery هنوز باید تصویب و آزموده شود.')
};
let current='catalog';
function render(view){current=screens[view]?view:'catalog';const info=views.find(v=>v[0]===current);root.querySelector('#sfp-location').textContent='Developer Admin / '+info[2];root.querySelector('#sfp-title').textContent=info[1];root.querySelector('#sfp-screen').innerHTML=screens[current]();root.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.go===current)));}
root.querySelector('nav').innerHTML=views.map(v=>`<button type="button" data-go="${v[0]}" aria-pressed="false" class="cursor-interaction">${v[1]}</button>`).join('');
function restore(s){if(s?.privateContent?.view&&screens[s.privateContent.view])render(s.privateContent.view)}
